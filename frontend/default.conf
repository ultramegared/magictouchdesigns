# Canonical por ruta (sin query) para el sub_filter de abajo.
map $request_uri $canonical_path {
    ~^(?<p>[^?]*) $p;
}

# Apex sin www: redirect permanente 301 a www conservando ruta y query.
server {
    listen 80;
    server_name jqydesigns.com;
    return 301 https://www.jqydesigns.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
        # Canonical propio por pagina en el HTML servido (no depende del JS):
        # reemplaza la canonical fija de la homepage por la de la ruta pedida.
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '<link rel="canonical" href="https://www.jqydesigns.com/" />' '<link rel="canonical" href="https://www.jqydesigns.com$canonical_path" />';
    }
}
